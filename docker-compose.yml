version: '3.8'

services:
  stremio-telegram-addon:
    build: .
    container_name: stremio-telegram-addon
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-7000}:${SERVER_PORT:-7000}"
    volumes:
      # Persistent data (SQLite library, settings.json, Telegram session)
      - ./data:/app/data
      - ./main.py:/app/main.py
      - ./tmdb.py:/app/tmdb.py
      - ./stashdb.py:/app/stashdb.py
      - ./database.py:/app/database.py
      - ./telegram_client.py:/app/telegram_client.py
      - ./settings_manager.py:/app/settings_manager.py
      - ./config.py:/app/config.py
      - ./streaming_engine.py:/app/streaming_engine.py
      - ./templates:/app/templates
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SERVER_PORT:-7000}/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
